services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      SRP_RATE_LIMIT: "30/minute"
    volumes:
      - prediction-logs:/app/logs
      - chroma-db:/app/chroma_db

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      SRP_API_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  prediction-logs:
  chroma-db:
