name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-agent.txt

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          SRP_RATE_LIMIT: 1000/minute
          # Deliberately no ANTHROPIC_API_KEY / GOOGLE_API_KEY: tests must not call LLMs.
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t srp-api .

      - name: Build UI image
        run: docker build -f docker/Dockerfile.ui -t srp-ui .

      - name: Verify UI app imports and renders in-container
        # AppTest executes app.py (API unreachable is fine: the app shows its
        # "cannot reach API" state). Catches import errors the Streamlit health
        # endpoint cannot, e.g. a module missing from the slim UI image.
        run: |
          docker run --rm srp-ui python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('/app/app.py', default_timeout=60).run()
          assert not at.exception, [e.value for e in at.exception]
          print('UI AppTest OK')
          "

      - name: Verify API serves predictions in-container
        run: |
          docker run -d --name srp-api -p 8000:8000 srp-api
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 3
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/models/status | tee /dev/stderr | grep -q '"all_ready":true'
          docker rm -f srp-api
